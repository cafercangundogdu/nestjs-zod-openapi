name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }}, nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 22.12 is the minimum NestJS 12 supports; Node 20 is EOL.
        node: [22, 24]
        # The lockfile pins NestJS 12; the 11 leg swaps in the previous major
        # so both halves of the peer range stay verified.
        nest: [11, 12]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Switch to NestJS 11
        if: matrix.nest == 11
        run: pnpm add -D @nestjs/common@11 @nestjs/core@11 @nestjs/platform-express@11 @nestjs/swagger@11 @nestjs/testing@11

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: pnpm run test:cov

      - name: Build
        run: pnpm run build

      - name: Publint
        run: npx publint

      - name: Are the types wrong?
        run: npx attw --pack .
