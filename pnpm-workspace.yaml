allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@asteasolutions/zod-to-openapi@9.0.0'
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@swc/core'
  - unrs-resolver
# Transitive dev-only security fixes whose parents pin pre-patch versions.
# (The rest resolve to patched releases naturally on a fresh install.)
overrides:
  multer: '>=2.2.0'
  brace-expansion@<1.1.13: '>=1.1.13'
  brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3'
